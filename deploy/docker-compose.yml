# Cloud deployment: API + PostgreSQL. Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up --build
#
# NOTE: EF migrations are provider-specific. The repo ships SQLite migrations for
# local dev. Before the first Postgres run, generate Postgres migrations once:
#   dotnet ef migrations add InitialPg --project src/QrDine.Infrastructure \
#     --startup-project src/QrDine.Api -o Persistence/Migrations \
#     -- --provider Postgres
# (see README for the provider-switch details).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qrdine
      POSTGRES_USER: qrdine
      POSTGRES_PASSWORD: change_me_in_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrdine"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=qrdine;Username=qrdine;Password=change_me_in_prod"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
